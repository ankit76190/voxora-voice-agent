# Render Blueprint for Voxora AI Voice Platform
services:
  - type: web
    name: voxora-backend-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers"
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "http://localhost:3000"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "12.0"
      - key: TELEPHONY_PROVIDER
        value: mock
      - key: TELEPHONY_ENABLE_REAL_CALLS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: voxora-db
          property: connectionString

  - type: static
    name: voxora-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: out
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://voxora-backend-api.onrender.com
      - key: NEXT_PUBLIC_APP_ENV
        value: production

databases:
  - name: voxora-db
    plan: free
    databaseName: voxora
    user: voxora_user

